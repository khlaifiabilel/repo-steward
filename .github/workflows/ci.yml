name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests and coverage
        run: pytest
      - name: Verify runtime lock
        if: matrix.python-version == '3.12'
        run: uv pip compile --generate-hashes --strip-extras --output-file=requirements.lock pyproject.toml && git diff --exit-code -- requirements.lock
      - name: Audit dependencies
        run: pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Dockerfile
        run: docker build --check .
      - name: Build image
        run: docker build --tag repo-steward:ci .
      - name: Generate OCI image with SBOM attestation
        run: docker buildx build --sbom=true --output type=oci,dest=/tmp/repo-steward.tar .
