name: Bug report
description: Report a reproducible defect in repo-steward
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private keys, webhook secrets, signatures, or private repository data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and include sanitized logs or correlation IDs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 4d11365
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials and private repository data from this report.
          required: true
